# This repository holds no CI logic. It says what to build and hands off to the platform's
# one build pipeline, so caching, scanning or a change of registry is a commit there rather
# than a change here and in every other project.
name: build

on:
  push:
    branches: [main]
  # Re-runnable by hand: a run that fails before any job starts cannot be retried via the API.
  workflow_dispatch:

# Required, and the cause of a long outage in this pipeline. The called workflow needs
# packages: write to push to GHCR, and a called workflow can only NARROW the caller's token,
# never widen it. This account defaults the workflow token to read-only, so without this
# block GitHub refused the run before creating a single job — no log, no annotation, just
# "startup_failure".
permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: yotam-personal/workflows/.github/workflows/build-service.yml@main
    with:
      image: yotam-personal/checkers-api
      # Builds the image and runs the leaderboard fidelity suite against a real Postgres
      # before anything is pushed. Every case in it is a defect an adversarial review found
      # in the move off Firestore, kept as a test rather than as a changelog.
      test: "docker build -t checkers-api:local . && test/fidelity.sh"
    secrets:
      ORBIT_DISPATCH_TOKEN: ${{ secrets.ORBIT_DISPATCH_TOKEN }}
